name: verify main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify all components
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Full verification must be dispatched from main" >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Dagger
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.11 sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify all components
        run: |
          npm ci --prefix .dagger --no-audit --no-fund
          dagger develop
          npm --prefix .dagger run verify
          dagger call verify --all
