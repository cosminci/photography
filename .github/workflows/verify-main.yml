name: verify main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify all components
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Full verification must be dispatched from main" >&2
            exit 1
          fi

      - name: Select cache generation
        id: cache-generation
        env:
          FINGERPRINT: ${{ hashFiles('dagger.lock', 'dagger.json', '.dagger/src/buildEnv.ts', '.dagger/src/hooks/cache.ts', 'backend/build.sbt', 'backend/.jvmopts', 'backend/.sbtopts', 'backend/project/**/*.sbt', 'backend/project/**/*.scala', 'backend/project/**/*.properties', 'frontend/package-lock.json') }}
        run: |
          mkdir -p "$RUNNER_TEMP/photography-build-cache"
          echo "prefix=photography-build-v1-$RUNNER_OS-$RUNNER_ARCH-$(date -u +%Y-%m)-$FINGERPRINT-" >> "$GITHUB_OUTPUT"

      - name: Restore trusted build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/photography-build-cache
          key: ${{ steps.cache-generation.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cache-generation.outputs.prefix }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Dagger
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.11 sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify all components
        shell: bash scripts/with_dagger_engine bash --noprofile --norc -euo pipefail {0}
        run: |
          npm ci --prefix .dagger --no-audit --no-fund
          dagger develop
          npm --prefix .dagger run verify
          dagger call verify-cached --state="$RUNNER_TEMP/photography-build-cache" --all sync
