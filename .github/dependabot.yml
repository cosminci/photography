version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/containers/photography"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/.dagger"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "sbt"
    directory: "/backend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        versions: ["*-*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
