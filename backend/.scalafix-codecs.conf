include required(file(".scalafix.conf"))
rules += AdapterCodecVisibility
rules += NoDefaultParameters
rules += MultilineComprehensionStep
rules += MultilineEitherCond
rules += SimplifiedForYield
rules += NoPredefRequire
rules += OptionEitherBindingNames
rules += NoPartialCaseClassDestructuring
rules += NoMultilineExpressionsInParentheses
rules += NoPositionalTupleSelectors
rules += PreferCatsSyntax
rules += NoMixedForComprehensionBindings
AdapterCodecVisibility.adapterPackages = ["photography/adapters/"]
AdapterCodecVisibility.sharedOwners = ["photography/adapters/http/JsonBody.", "photography/adapters/sqlite/SqliteCodecs."]
